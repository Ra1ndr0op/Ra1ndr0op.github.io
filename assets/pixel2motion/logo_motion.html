<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ra1ndrop Logo Motion</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050505;
        --ink: #f8f8f2;
        --muted: #aaa8a0;
        --line: rgba(255, 255, 255, 0.16);
        --duration: 1600ms;
        --speed: 1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: var(--ink);
        background:
          radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.12), transparent 34%),
          #050505;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(980px, calc(100vw - 32px));
        padding: 32px 0;
      }

      .stage {
        min-height: 520px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 32px 90px rgba(0, 0, 0, 0.32);
        overflow: hidden;
      }

      #logo-root {
        width: min(294px, 70vw);
        overflow: visible;
      }

      .controls,
      .principles,
      .atoms {
        margin-top: 18px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }

      button,
      label,
      .pill,
      .atom {
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.08);
        font: inherit;
        font-weight: 800;
      }

      button,
      label,
      .pill {
        padding: 10px 13px;
      }

      button {
        cursor: pointer;
      }

      input[type="range"] {
        width: 170px;
        vertical-align: middle;
      }

      .pill {
        color: var(--muted);
        font-size: 0.78rem;
      }

      .atoms {
        margin-top: 22px;
      }

      .atom {
        width: 120px;
        height: 92px;
        display: grid;
        place-items: center;
        border-radius: 18px;
      }

      .atom svg {
        width: 54px;
        overflow: visible;
      }

      .atom img {
        width: 64px;
        height: 82px;
        object-fit: contain;
        display: block;
      }

      .p2m-logo {
        overflow: visible;
      }

      .p2m-ribbon,
      .p2m-dot,
      .p2m-dot-glow,
      .p2m-wordmark {
        transform-box: fill-box;
        transform-origin: center;
      }

      .p2m-mark {
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: p2m-mark-stage calc(var(--duration) / var(--speed)) cubic-bezier(0.34, 0, 0.14, 1) both;
      }

      .p2m-ribbon-left {
        animation: p2m-ribbon-left calc(var(--duration) / var(--speed)) cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .p2m-ribbon-right {
        animation: p2m-ribbon-right calc(var(--duration) / var(--speed)) cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .p2m-dot {
        animation:
          p2m-dot-arrive calc(var(--duration) / var(--speed)) cubic-bezier(0.16, 1, 0.3, 1) both,
          p2m-dot-breathe calc(3600ms / var(--speed)) cubic-bezier(0.4, 0, 0.6, 1) calc(1700ms / var(--speed)) infinite;
      }

      .p2m-dot-glow {
        mix-blend-mode: screen;
        animation: p2m-dot-glow calc(3600ms / var(--speed)) cubic-bezier(0.4, 0, 0.6, 1) calc(1700ms / var(--speed)) infinite;
      }

      .p2m-wordmark {
        animation: p2m-wordmark-rise calc(var(--duration) / var(--speed)) cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .atom-pulse .p2m-dot {
        animation: p2m-dot-breathe 1400ms cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      .atom-pulse img {
        animation: p2m-dot-breathe 1400ms cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      .atom-lift .p2m-mark,
      .atom-lift img {
        animation: p2m-hover-lift 1600ms cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      .atom-word .p2m-wordmark,
      .atom-word img {
        animation: p2m-wordmark-rise 1600ms cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      @keyframes p2m-mark-stage {
        0% { opacity: 1; transform: translateY(18px) scale(0.94); }
        20% { opacity: 1; transform: translateY(22px) scale(0.9); animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1); }
        70% { opacity: 1; transform: translateY(-3px) scale(1.018); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes p2m-ribbon-left {
        0% { opacity: 0.16; transform: translateY(18px) rotate(-3deg) scale(0.96); }
        28% { opacity: 0.16; transform: translateY(18px) rotate(-3deg) scale(0.96); }
        72% { opacity: 1; transform: translateY(-2px) rotate(0.6deg) scale(1.012); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
        100% { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
      }

      @keyframes p2m-ribbon-right {
        0% { opacity: 0.12; transform: translateY(20px) rotate(5deg) scale(0.94); }
        36% { opacity: 0.12; transform: translateY(20px) rotate(5deg) scale(0.94); }
        78% { opacity: 1; transform: translateY(-3px) rotate(-0.9deg) scale(1.015); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
        100% { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
      }

      @keyframes p2m-dot-arrive {
        0%, 54% { opacity: 0; transform: translateY(22px) scale(0.3); }
        74% { opacity: 1; transform: translateY(-2px) scale(1.22); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes p2m-wordmark-rise {
        0%, 48% { opacity: 0; transform: translateY(18px); }
        82% { opacity: 1; transform: translateY(-1px); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
        100% { opacity: 1; transform: translateY(0); }
      }

      @keyframes p2m-dot-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
      }

      @keyframes p2m-dot-glow {
        0%, 100% { opacity: 0; transform: scale(0.72); }
        50% { opacity: 0.2; transform: scale(1); }
      }

      @keyframes p2m-hover-lift {
        0%, 100% { transform: translateY(0) scale(1); }
        55% { transform: translateY(-5px) scale(1.018); }
      }

      .is-static .p2m-mark,
      .is-static .p2m-ribbon,
      .is-static .p2m-dot,
      .is-static .p2m-dot-glow,
      .is-static .p2m-wordmark {
        animation: none;
      }

      .is-static .p2m-mark,
      .is-static .p2m-ribbon,
      .is-static .p2m-dot,
      .is-static .p2m-wordmark {
        opacity: 1;
        transform: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .p2m-mark,
        .p2m-ribbon,
        .p2m-dot,
        .p2m-dot-glow,
        .p2m-wordmark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="stage" aria-label="Ra1ndrop logo motion stage">
        <svg id="logo-root" class="p2m-logo" viewBox="0 0 420 540" role="img" aria-labelledby="logo-title">
          <title id="logo-title">Ra1ndrop</title>
          <defs>
            <linearGradient id="p2m-silver-left" x1="144" y1="64" x2="238" y2="358" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#ffffff" />
              <stop offset="0.48" stop-color="#f5f2ea" />
              <stop offset="1" stop-color="#8f8f88" />
            </linearGradient>
            <linearGradient id="p2m-silver-right" x1="286" y1="122" x2="200" y2="372" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#ffffff" />
              <stop offset="0.42" stop-color="#f2efe8" />
              <stop offset="1" stop-color="#85847d" />
            </linearGradient>
            <radialGradient id="p2m-ember" cx="50%" cy="45%" r="58%">
              <stop offset="0" stop-color="#fff6a8" />
              <stop offset="0.52" stop-color="#ffd534" />
              <stop offset="1" stop-color="#b66e00" />
            </radialGradient>
          </defs>
          <g id="mark" class="p2m-mark" transform="translate(0 4)">
            <path id="ribbon-left" class="p2m-ribbon p2m-ribbon-left" d="M209 54 C205 126 166 170 154 226 C141 287 174 331 203 370 C180 334 174 298 186 259 C198 221 224 181 224 142 C224 106 214 78 209 54 Z" fill="url(#p2m-silver-left)" />
            <path id="ribbon-right" class="p2m-ribbon p2m-ribbon-right" d="M231 151 C277 196 301 251 288 303 C278 344 246 365 219 378 C241 347 251 319 246 288 C241 256 213 230 214 199 C215 181 222 165 231 151 Z" fill="url(#p2m-silver-right)" />
            <circle id="dot-glow" class="p2m-dot-glow" cx="215" cy="373" r="22" fill="#ffd534" opacity="0" />
            <circle id="dot" class="p2m-dot" cx="215" cy="373" r="8.2" fill="url(#p2m-ember)" />
          </g>
          <text id="wordmark" class="p2m-wordmark" x="210" y="452" text-anchor="middle" fill="#f6f1e8" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="400">Ra1ndrop</text>
        </svg>
      </section>

      <div class="controls">
        <button id="replay" type="button">Replay</button>
        <button id="slow" type="button" aria-pressed="false">Slow</button>
        <label>Speed <input id="speed" type="range" min="0.35" max="1.4" value="1" step="0.05" /></label>
      </div>

      <div class="principles" aria-label="Motion principles">
        <span class="pill">Staging</span>
        <span class="pill">Timing</span>
        <span class="pill">Slow In / Out</span>
        <span class="pill">Follow Through</span>
        <span class="pill">Appeal</span>
      </div>

      <div class="atoms" aria-label="Atomic motion studies">
        <div class="atom atom-pulse" aria-label="Ember pulse">
          <img src="logo.svg" alt="" />
        </div>
        <div class="atom atom-lift" aria-label="Mark lift">
          <img src="logo.svg" alt="" />
        </div>
        <div class="atom atom-word" aria-label="Wordmark rise">
          <img src="logo.svg" alt="" />
        </div>
      </div>
    </main>

    <script>
      const root = document.getElementById("logo-root");
      const replay = document.getElementById("replay");
      const slow = document.getElementById("slow");
      const speed = document.getElementById("speed");
      const params = new URLSearchParams(location.search);

      function setFinalLogo() {
        root.classList.add("is-static");
      }

      function restart() {
        root.classList.remove("is-static");
        root.style.animation = "none";
        root.getBoundingClientRect();
        root.style.animation = "";
      }

      function setSpeed(value) {
        document.documentElement.style.setProperty("--speed", value);
        if (document.getAnimations) {
          for (const animation of document.getAnimations()) {
            animation.playbackRate = Number(value);
          }
        }
      }

      replay.addEventListener("click", restart);
      slow.addEventListener("click", () => {
        const active = slow.getAttribute("aria-pressed") !== "true";
        slow.setAttribute("aria-pressed", String(active));
        speed.value = active ? "0.4" : "1";
        setSpeed(speed.value);
      });
      speed.addEventListener("input", () => setSpeed(speed.value));

      if (params.has("static")) {
        setFinalLogo();
      }

      if (params.has("t")) {
        const ms = Math.max(0, Number(params.get("t")) || 0);
        document.getAnimations().forEach((animation) => {
          animation.pause();
          animation.currentTime = ms;
        });
      }

      root.dataset.p2mReady = "true";
      try {
        window.__p2mReady = true;
      } catch (error) {
        document.documentElement.dataset.p2mReady = "true";
      }
      setSpeed(speed.value);
    </script>
  </body>
</html>
